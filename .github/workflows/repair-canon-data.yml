name: Repair canon data

on:
  push:
    paths:
      - '.github/workflows/repair-canon-data.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Repair Forrester syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('canon-data.js')
          text = path.read_text()

          old = '''              "footerClasses": [
                "canonPlayedBy",
                "canonDeceasedFooter"
              ],
            {
              "classes": [
                "canonDeceased"
              ],
              "portrait": "https://i.imgur.com/s94eQ9e.gif",
              "name": "Cassidy Erin Forrester",'''

          new = '''              "footerClasses": [
                "canonPlayedBy",
                "canonDeceasedFooter"
              ]
            },
            {
              "classes": [
                "canonDeceased"
              ],
              "portrait": "https://i.imgur.com/s94eQ9e.gif",
              "name": "Cassidy Erin Forrester",'''

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one malformed Forrester block, found {count}.')

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate JavaScript
        run: node --check canon-data.js

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canon-data.js
          git commit -m "Fix Forrester family syntax"
          git push

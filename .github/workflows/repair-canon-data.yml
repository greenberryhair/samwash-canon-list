name: Repair canon data

on:
  push:
    paths:
      - '.github/workflows/repair-canon-data.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Repair Forrester syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('canon-data.js')
          text = path.read_text()

          pattern = re.compile(
              r'("footerClasses"\s*:\s*\[\s*"canonPlayedBy"\s*,\s*"canonDeceasedFooter"\s*\])\s*,\s*'
              r'(\{\s*"classes"\s*:\s*\[\s*"canonDeceased"\s*\]\s*,\s*'
              r'"portrait"\s*:\s*"https://i\.imgur\.com/s94eQ9e\.gif"\s*,\s*'
              r'"name"\s*:\s*"Cassidy Erin Forrester")'
          )

          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one malformed Forrester block, found {len(matches)}.')

          text = pattern.sub(r'\1\n            },\n            \2', text, count=1)
          path.write_text(text)
          PY

      - name: Validate JavaScript
        run: node --check canon-data.js

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canon-data.js
          git commit -m "Fix Forrester family syntax"
          git push
